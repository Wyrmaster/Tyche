name: Release

# Runs only when a tag like v1.0.1 is pushed. The version comes from the tag alone.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "full=${version}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs the tests on Alpine with ImageMagick 7; a failure stops the job before anything is pushed.
      - name: Test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Tyche/Service/Library/Dockerfile
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Tyche/Service/Library/Dockerfile
          push: true
          cache-from: type=gha
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_NUMBER=${{ steps.version.outputs.build }}
          tags: |
            ${{ steps.version.outputs.image }}:v${{ steps.version.outputs.full }}
            ${{ steps.version.outputs.image }}:v${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
